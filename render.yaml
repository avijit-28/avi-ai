services:
  - type: web
    name: avi-ai-attendant
    env: python
    region: singapore # Closest low-latency region to India
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: gemini-3.5-flash-lite
      - key: PYTHONPATH
        value: .
